[project]
name = "paper2repro"
version = "0.1.0"
description = "Evidence-grounded reproducibility auditing for machine learning papers and repositories."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.116.0",
    "pydantic>=2.13.5",
    "pypdf>=6.0.0",
    "uvicorn>=0.35.0",
]

[build-system]
requires = ["uv_build>=0.12.17,<0.13"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
